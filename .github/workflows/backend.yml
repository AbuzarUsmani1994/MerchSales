name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "database/**", "deploy/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "database/**", "deploy/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    # GitHub Actions service containers only run on Linux runners, not Windows — Testcontainers
    # (used by StockOrder.IntegrationTests' DatabaseFixture) needs Docker too, which ubuntu-latest
    # has preinstalled. The published win-x64 artifacts below are still valid Windows binaries;
    # cross-publishing doesn't require building on Windows itself.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/StockOrder.sln

      - name: Build
        run: dotnet build backend/StockOrder.sln --no-restore -c Release

      - name: Unit + architecture tests
        run: |
          dotnet test backend/tests/StockOrder.UnitTests/StockOrder.UnitTests.csproj --no-build -c Release --logger "trx"
          dotnet test backend/tests/StockOrder.ArchitectureTests/StockOrder.ArchitectureTests.csproj --no-build -c Release --logger "trx"

      - name: Integration tests
        # No TEST_SQL_CONNECTION set — DatabaseFixture starts its own Testcontainers SQL Server.
        run: dotnet test backend/tests/StockOrder.IntegrationTests/StockOrder.IntegrationTests.csproj --no-build -c Release --logger "trx"

      - name: Publish API
        run: dotnet publish backend/src/Hosts/StockOrder.Api/StockOrder.Api.csproj -c Release -r win-x64 --self-contained false -o publish/api

      - name: Publish Worker
        run: dotnet publish backend/src/Hosts/StockOrder.Worker/StockOrder.Worker.csproj -c Release -r win-x64 --self-contained false -o publish/worker

      - uses: actions/upload-artifact@v4
        with:
          name: stockorder-api
          path: publish/api

      - uses: actions/upload-artifact@v4
        with:
          name: stockorder-worker
          path: publish/worker

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    # Runs only on main, and only once the self-hosted runner (installed on the target
    # server itself — see docs/deploy-runbook.md) picks up the job. No credentials for the
    # server are stored in GitHub: the runner already runs locally on that machine with
    # whatever rights were granted when it was registered as a service.
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, windows, stockorder-prod]
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: stockorder-api
          path: publish/api

      - uses: actions/download-artifact@v4
        with:
          name: stockorder-worker
          path: publish/worker

      - name: Deploy API
        shell: powershell
        run: deploy/Deploy-Api.ps1 -SourcePath "${{ github.workspace }}/publish/api"

      - name: Deploy Worker
        shell: powershell
        run: deploy/Deploy-Worker.ps1 -SourcePath "${{ github.workspace }}/publish/worker"
