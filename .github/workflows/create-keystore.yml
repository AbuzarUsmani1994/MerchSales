name: create-keystore

# One-off, manual workflow (section 17.1): generates the Android release signing keystore
# and prints exactly what to paste into GitHub secrets. Run it once, save the secrets, then
# you never need to run it again (re-running would invalidate any app already published
# with the old key — don't run this after your first real release).

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias"
        required: true
        default: "stockorder"
      commonName:
        description: "Certificate common name (your company name)"
        required: true
        default: "StockOrder"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          STORE_PASSWORD=$(openssl rand -base64 24)
          KEY_PASSWORD=$(openssl rand -base64 24)

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=${{ inputs.commonName }}, OU=Mobile, O=${{ inputs.commonName }}, L=, S=, C=PK"

          echo "## Keystore generated — save these as repository secrets now" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ANDROID_KEYSTORE_BASE64   = $(base64 -w0 release.keystore)" >> "$GITHUB_STEP_SUMMARY"
          echo "ANDROID_KEYSTORE_PASSWORD = $STORE_PASSWORD" >> "$GITHUB_STEP_SUMMARY"
          echo "ANDROID_KEY_ALIAS         = ${{ inputs.alias }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ANDROID_KEY_PASSWORD      = $KEY_PASSWORD" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Go to Settings > Secrets and variables > Actions and add each of the four" >> "$GITHUB_STEP_SUMMARY"
          echo "values above as a new repository secret with the name on the left. Do not" >> "$GITHUB_STEP_SUMMARY"
          echo "commit release.keystore anywhere — delete it from your machine once saved." >> "$GITHUB_STEP_SUMMARY"
