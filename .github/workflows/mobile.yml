name: mobile

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

env:
  # Pinned (section 17.1). The app needs Dart >= 3.8 and the package:sqlite3 build hooks
  # that bundle SQLCipher, so older Flutter releases can't build it.
  FLUTTER_VERSION: "3.47.8"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle.kts', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Generate code (Drift database, localizations)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Determine flavor and version
        id: flavor
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'dev' }}"
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check API_BASE_URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::Repository variable API_BASE_URL is not set — the app will build but can't sign in. See docs/mobile-build.md."
          elif [ "${{ steps.flavor.outputs.flavor }}" = "prod" ] && [[ "$API_BASE_URL" != https://* ]]; then
            echo "::error::The prod flavor only talks HTTPS, but API_BASE_URL is '$API_BASE_URL'. Build the dev flavor, or put the API behind HTTPS first."
            exit 1
          fi

      - name: Decode google-services.json (optional — push disabled if absent)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Decode release keystore (optional — falls back to debug signing if absent)
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "hasKeystore=true" >> "$GITHUB_OUTPUT"

      - name: Write key.properties
        if: steps.keystore.outputs.hasKeystore == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          # Always release mode: compiled Dart, no debug VM, about a fifth of a debug APK's
          # size. Signing is separate: the keystore secrets when present, otherwise the
          # Android debug key (android/app/build.gradle.kts), which section 17.1 allows.
          # Real phones only (32- and 64-bit ARM); x86_64 is just for PC emulators.
          flutter build apk --release --flavor "${{ steps.flavor.outputs.flavor }}" \
            --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FLAVOR="${{ steps.flavor.outputs.flavor }}" \
            --dart-define=APP_VERSION="${{ steps.flavor.outputs.version }}"

      - name: Rename artifact
        id: artifact
        run: |
          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          NAME="app-$FLAVOR-${{ steps.flavor.outputs.version }}.apk"
          cp "build/app/outputs/flutter-apk/app-$FLAVOR-release.apk" "build/app/outputs/flutter-apk/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.keystore.outputs.hasKeystore }}" != "true" ]; then
            echo "::warning::No release keystore secrets: this APK is signed with this build's throwaway debug key. Phones can't install the next build over it without uninstalling first. Run the create-keystore workflow once (docs/mobile-build.md)."
          fi
          ls -l "build/app/outputs/flutter-apk/$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: mobile/build/app/outputs/flutter-apk/${{ steps.artifact.outputs.name }}
