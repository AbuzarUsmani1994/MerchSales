name: mobile

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

env:
  FLUTTER_VERSION: "3.27.1"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode google-services.json (optional — push disabled if absent)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Decode release keystore (optional — falls back to debug signing if absent)
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "hasKeystore=true" >> "$GITHUB_OUTPUT"

      - name: Write key.properties
        if: steps.keystore.outputs.hasKeystore == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Determine flavor
        id: flavor
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'dev' }}"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          BUILD_MODE="--debug"
          if [ "${{ steps.keystore.outputs.hasKeystore }}" = "true" ]; then
            BUILD_MODE="--release"
          fi
          flutter build apk $BUILD_MODE --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Rename artifact
        id: artifact
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          MODE="debug"
          if [ "${{ steps.keystore.outputs.hasKeystore }}" = "true" ]; then MODE="release"; fi
          NAME="app-${{ steps.flavor.outputs.flavor }}-$VERSION-$MODE.apk"
          SRC="build/app/outputs/flutter-apk/app-$MODE.apk"
          cp "$SRC" "build/app/outputs/flutter-apk/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: mobile/build/app/outputs/flutter-apk/${{ steps.artifact.outputs.name }}
